<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="weather">
        <h2>WEATHER APP</h2>
        <input id="city" class="form-control mt-3" value="Calicut" placeholder="enter city">
        <button class="btn btn-primary mt-3" onclick="weather()">get </button>
        <div id="output">

        </div>
    </div>
</body>
<script>
    function weather(){
        let city=document.getElementById("city").value
        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=5b4bee0ba241d092159faf007e166080&units=metric`)
        .then(response=>response.json()).then(data=>{
            document.getElementById("output").innerHTML=`<h3>${data.name}</h3>
            <div id="temp">${data.main.temp}°C</div>
            <h5>${data.weather[0].description}</h5>
            <p>humidity:${data.main.humidity}%</p>`

        })
    } 
</script>
</html>
